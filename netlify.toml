[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions/"

# Daily Web Push for subscription expiry (09:00 UTC)
[functions."send-push-cron"]
  schedule = "0 9 * * *"

# Weekly 手機比價 (landtop_history) snapshot refresh (Monday 09:00 Taipei)
[functions."landtop-history-cron"]
  schedule = "0 1 * * 1"

# Resend expiry emails, checked 3x daily (Asia/Taipei 05:27 / 11:27 / 17:27).
# Shares the resend_notify_log dedupe table with the browser, so an item is
# emailed once; a slot that fails to send leaves it unlogged for the next slot.
[functions."resend-expiry-cron-morning"]
  schedule = "27 21 * * *"

[functions."resend-expiry-cron-noon"]
  schedule = "27 3 * * *"

[functions."resend-expiry-cron-evening"]
  schedule = "27 9 * * *"

# Netlify Blobs proxy
[[redirects]]
  from = "/api/blobs/*"
  to = "/.netlify/functions/blob-proxy"
  status = 200

# Cache headers for blob API
[[headers]]
  for = "/api/blobs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"
